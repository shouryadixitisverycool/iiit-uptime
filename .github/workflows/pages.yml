name: Deploy to GitHub Pages

# data is main plus one commit adding state.json and speed.json. The Kuma host force-pushes it
# every 5 minutes, and each push rebuilds the site with the new snapshot.
on:
  push:
    branches: [main, data]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer snapshot makes any running build pointless
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-
      # A push to main has no snapshot, so take the latest one from data
      - run: |
          test -f state.json || { git fetch --depth=1 origin data && git show FETCH_HEAD:state.json > state.json; }
          test -f speed.json || git show FETCH_HEAD:speed.json > speed.json 2>/dev/null || echo '[]' > speed.json
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
